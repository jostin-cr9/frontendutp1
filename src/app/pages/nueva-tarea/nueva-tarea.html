<div class="container mt-4">

  <h2>➕ Nueva Tarea</h2>

  <form (ngSubmit)="guardar()" class="card p-3 shadow">

    <input class="form-control mb-2"
           placeholder="Título"
           [(ngModel)]="tarea.titulo"
           name="titulo">

    <input class="form-control mb-2"
           placeholder="Curso"
           [(ngModel)]="tarea.curso"
           name="curso">

    <input type="date" class="form-control mb-2"
           [(ngModel)]="tarea.fechaEntrega"
           name="fechaEntrega">

    <select class="form-control mb-2"
            [(ngModel)]="tarea.estado"
            name="estado">
      <option>pendiente</option>
      <option>en progreso</option>
      <option>completado</option>
    </select>

    <select class="form-control mb-2"
            [(ngModel)]="tarea.prioridad"
            name="prioridad">
      <option>baja</option>
      <option>media</option>
      <option>alta</option>
    </select>

    <button class="btn btn-primary w-100">
      Guardar
    </button>

  </form>

  <p class="mt-3 text-success">{{ mensaje }}</p>

</div>
